name: API tests

on:
  push:
    paths:
      - "packages/api/**"
      - ".github/workflows/api-tests.yml"
  pull_request:
    paths:
      - "packages/api/**"

jobs:
  pytest:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: packages/api
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install deps
        run: pip install -r requirements.txt
      - name: Pytest
        env:
          PYTHONPATH: ${{ github.workspace }}/packages/api
        run: pytest -q
