services:
  citrus-api:
    image: ghcr.io/r2pen2/citrus-api:${CITRUS_API_IMAGE_TAG:-latest}
    container_name: citrus-api
    restart: unless-stopped
    env_file:
      - ${CITRUS_API_ENV_FILE:-/opt/services/data/app-env/citrus-api.env}
    environment:
      PORT: "8000"
      MONGODB_URI: ${CITRUS_MONGODB_URI:-mongodb://citrus-mongo:27017}
      MONGODB_DB: ${CITRUS_MONGODB_DB:-citrus}
    networks:
      - proxy
      - citrus_internal
    labels:
      com.centurylinklabs.watchtower.enable: "true"
      traefik.enable: "true"
      traefik.docker.network: proxy
      traefik.http.services.citrus-api.loadbalancer.server.port: "8000"

      # Public health probes (no SSO)
      traefik.http.routers.citrus-api-public.rule: (Host(`citrus-api.joed.dev`) || Host(`api.citrus.joed.dev`)) && Path(`/health`)
      traefik.http.routers.citrus-api-public.entrypoints: web
      traefik.http.routers.citrus-api-public.priority: "100"
      traefik.http.routers.citrus-api-public.service: citrus-api

      # API behind joed.dev Google SSO (oauth2-proxy forwardAuth)
      traefik.http.routers.citrus-api.rule: Host(`citrus-api.joed.dev`) || Host(`api.citrus.joed.dev`)
      traefik.http.routers.citrus-api.entrypoints: web
      traefik.http.routers.citrus-api.priority: "1"
      traefik.http.routers.citrus-api.middlewares: sso@file
      traefik.http.routers.citrus-api.service: citrus-api

networks:
  proxy:
    external: true
  citrus_internal:
    external: true
    name: citrus_internal
