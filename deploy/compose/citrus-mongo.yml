# MongoDB for Citrus (infra — no Traefik).
# Runtime on glados: /opt/services/apps/citrus-mongo/compose.yml
# Data: /opt/services/data/app-assets/citrus-mongo

services:
  citrus-mongo:
    image: mongo:7
    container_name: citrus-mongo
    restart: unless-stopped
    volumes:
      - ${CITRUS_MONGO_DATA_PATH:-/opt/services/data/app-assets/citrus-mongo}:/data/db
    networks:
      - citrus_internal
    healthcheck:
      test: ["CMD", "mongosh", "--quiet", "--eval", "db.adminCommand('ping').ok"]
      interval: 10s
      timeout: 5s
      retries: 8
      start_period: 20s

networks:
  citrus_internal:
    external: true
    name: citrus_internal
