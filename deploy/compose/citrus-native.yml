services:
  citrus-native:
    image: ghcr.io/r2pen2/citrus-native:${CITRUS_NATIVE_IMAGE_TAG:-latest}
    container_name: citrus-native
    restart: unless-stopped
    networks:
      - proxy
    labels:
      com.centurylinklabs.watchtower.enable: "true"
      traefik.enable: "true"
      traefik.docker.network: proxy
      traefik.http.services.citrus-native.loadbalancer.server.port: "80"

      # Static assets — no SSO
      traefik.http.routers.citrus-native-public.rule: (Host(`citrusnative.joed.dev`) || Host(`www.citrusnative.joed.dev`)) && (PathPrefix(`/static`) || PathPrefix(`/_expo`) || Path(`/manifest.json`) || Path(`/favicon.ico`) || Path(`/robots.txt`))
      traefik.http.routers.citrus-native-public.entrypoints: web
      traefik.http.routers.citrus-native-public.priority: "100"
      traefik.http.routers.citrus-native-public.service: citrus-native

      traefik.http.routers.citrus-native.rule: Host(`citrusnative.joed.dev`) || Host(`www.citrusnative.joed.dev`)
      traefik.http.routers.citrus-native.entrypoints: web
      traefik.http.routers.citrus-native.priority: "1"
      traefik.http.routers.citrus-native.middlewares: sso@file
      traefik.http.routers.citrus-native.service: citrus-native

networks:
  proxy:
    external: true
